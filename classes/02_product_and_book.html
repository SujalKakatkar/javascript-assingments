<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="name">Enter the Book Name</label>
        <input type="text" name="name">
        <br><br>
        <label for="author">Enter the Author</label>
        <input type="text" name="author">
        <br><br>
        <label for="price">Enter the Price</label>
        <input type="text" name="price">
        <button type="button" onclick="showBook()">show</button>
    </form>
    <script>

        class Product {
            constructor(name, price) {
                this.name = name;
                this.price = price;
            }
            getInfo() {
                return "Product: " + this.name + ", Price: $" + this.price;
            }
        }

        class Book extends Product {
            constructor(name, price, author) {
                super(name, price);
                this.author = author;
            }
            getInfo() {
                return "Book: " + this.name + " by " + this.author + ", Price: $" + this.price;
            }
        }

        function showBook() {
            let name = document.form.name.value;
            let author = document.form.author.value;
            let price = parseFloat(document.form.price.value);
            let book = new Book(name, price, author);
            console.log(book);
            alert(book.getInfo())
        }

    </script>
</body>

</html>
