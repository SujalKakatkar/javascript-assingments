<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="sumPositive()">sum</button>
    </form>
    <script>

        function sumPositive() {
            let arr = document.form.arr.value.split(",").map(x => parseInt(x));
            let sum = arr.filter(x => x > 0).reduce((total, x) => total + x, 0);
            console.log(sum);
            alert("Sum of positive numbers = " + sum)
        }

    </script>
</body>

</html>
