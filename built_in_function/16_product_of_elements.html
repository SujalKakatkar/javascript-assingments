<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="findProduct()">product</button>
    </form>
    <script>

        function findProduct() {
            let arr = document.form.arr.value.split(",").map(x => parseInt(x));
            let product = arr.reduce((total, x) => total * x, 1);
            console.log(product);
            alert("Product = " + product)
        }

    </script>
</body>

</html>
