<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Names (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="checkNames()">check</button>
    </form>
    <script>

        function checkNames() {
            let arr = document.form.arr.value.split(",").map(s => s.trim());
            let result = arr.every(s => s.length > 5);
            console.log(result);
            if (result) {
                alert("All names are longer than 5 characters")
            } else {
                alert("All names are not longer than 5 characters")
            }
        }

    </script>
</body>

</html>
