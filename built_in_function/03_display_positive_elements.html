<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="showPositive()">show</button>
    </form>
    <script>

        function showPositive() {
            let arr = document.form.arr.value.split(",").map(x => parseInt(x));
            let result = arr.filter(x => x > 0);
            console.log(result);
            if (result.length == 0) {
                alert("No positive elements found")
            } else {
                alert(result)
            }
        }

    </script>
</body>

</html>
