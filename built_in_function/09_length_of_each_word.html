<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Strings (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="wordLengths()">find length</button>
    </form>
    <script>

        function wordLengths() {
            let arr = document.form.arr.value.split(",").map(s => s.trim());
            let result = arr.map(s => s.length);
            console.log(result);
            alert("Lengths: " + result)
        }

    </script>
</body>

</html>
