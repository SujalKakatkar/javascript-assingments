<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Strings (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="startsWithB()">find</button>
    </form>
    <script>

        function startsWithB() {
            let arr = document.form.arr.value.split(",").map(s => s.trim());
            let result = arr.filter(s => s.toLowerCase().startsWith("b"));
            console.log(result);
            if (result.length == 0) {
                alert("No words starting with b found")
            } else {
                alert(result)
            }
        }

    </script>
</body>

</html>
