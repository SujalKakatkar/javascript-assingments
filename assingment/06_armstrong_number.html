<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="num">Enter the Number</label>
        <input type="text" name="num">
        <button type="button" onclick="checkArmstrong()">check</button>
    </form>
    <script>


        function checkArmstrong() {
            let num = parseInt(document.form.num.value);
            let temp = num;
            let count = 0;
            while (temp > 0) {
                count++;
                temp = Math.floor(temp / 10);
            }
            temp = num;
            let sum = 0;
            while (temp > 0) {
                let digit = temp % 10;
                sum = sum + Math.pow(digit, count);
                temp = Math.floor(temp / 10);
            }
            console.log(sum);
            if (sum == num) {
                alert(num + " is an Armstrong number")
            } else {
                alert(num + " is not an Armstrong number")
            }
        }

    </script>
</body>

</html>
