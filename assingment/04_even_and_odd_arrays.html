<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter 10 Numbers (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="separateEvenOdd()">separate</button>
    </form>
    <script>


        function separateEvenOdd() {
            let arr = document.form.arr.value.split(",");
            if (arr.length != 10) {
                alert("Please enter exactly 10 numbers")
                return;
            }
            let Even = [];
            let Odd = [];
            for (let i = 0; i < arr.length; i++) {
                let n = parseInt(arr[i]);
                if (n % 2 == 0) {
                    Even.push(n);
                } else {
                    Odd.push(n);
                }
            }
            console.log(Even, Odd);
            alert("Even numbers: " + Even + "\nOdd numbers: " + Odd)
        }

    </script>
</body>

</html>
