<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="findSum()">sum</button>
    </form>
    <script>


        function findSum() {
            let arr = document.form.arr.value.split(",");
            let sum = 0;
            for (let i = 0; i < arr.length; i++) {
                sum = sum + parseInt(arr[i]);
            }
            console.log(sum);
            alert("Sum = " + sum)
        }

    </script>
</body>

</html>
