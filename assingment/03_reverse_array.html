<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="reverseArray()">reverse</button>
    </form>
    <script>


        function reverseArray() {
            let arr = document.form.arr.value.split(",");
            let result = "";
            for (let i = arr.length - 1; i >= 0; i--) {
                result += arr[i];
                if (i > 0) {
                    result += ",";
                }
            }
            console.log(result);
            alert("Reverse array: " + result)
        }

    </script>
</body>

</html>
