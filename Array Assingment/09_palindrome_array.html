<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="checkPalindrome()">check</button>
    </form>
    <script>


        function checkPalindrome() {
            let arr = document.form.arr.value.split(",");
            let isPalindrome = true;
            let start = 0;
            let end = arr.length - 1;
            while (start < end) {
                if (arr[start].trim() != arr[end].trim()) {
                    isPalindrome = false;
                    break;
                }
                start++;
                end--;
            }
            console.log(arr);
            if (isPalindrome) {
                alert("Array is a palindrome")
            } else {
                alert("Array is not a palindrome")
            }
        }

    </script>
</body>

</html>
