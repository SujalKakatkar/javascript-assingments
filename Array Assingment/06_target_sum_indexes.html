<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <br><br>
        <label for="target">Enter the Target Sum</label>
        <input type="text" name="target">
        <button type="button" onclick="findIndexes()">find</button>
    </form>
    <script>


        function findIndexes() {
            let arr = document.form.arr.value.split(",");
            let target = parseInt(document.form.target.value);
            let result = "";
            for (let i = 0; i < arr.length; i++) {
                for (let j = i + 1; j < arr.length; j++) {
                    if (parseInt(arr[i]) + parseInt(arr[j]) == target) {
                        result += "[" + i + "," + j + "] ";
                    }
                }
            }
            console.log(result);
            if (result == "") {
                alert("[-1,-1]")
            } else {
                alert(result)
            }
        }

    </script>
</body>

</html>
