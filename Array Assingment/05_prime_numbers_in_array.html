<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <button type="button" onclick="findPrimes()">find primes</button>
    </form>
    <script>


        function findPrimes() {
            let arr = document.form.arr.value.split(",");
            let primes = [];
            for (let i = 0; i < arr.length; i++) {
                let n = parseInt(arr[i]);
                if (n < 2) {
                    continue;
                }
                let isPrime = true;
                for (let j = 2; j * j <= n; j++) {
                    if (n % j == 0) {
                        isPrime = false;
                        break;
                    }
                }
                if (isPrime) {
                    primes.push(n);
                }
            }
            console.log(primes);
            if (primes.length == 0) {
                alert("No prime numbers found")
            } else {
                alert("Prime numbers: " + primes)
            }
        }

    </script>
</body>

</html>
