<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form name="form">
        <label for="arr">Enter the Array Elements (separated by comma)</label>
        <input type="text" name="arr">
        <br><br>
        <label for="num">Enter the Number to Remove</label>
        <input type="text" name="num">
        <button type="button" onclick="removeNumber()">remove</button>
    </form>
    <script>


        function removeNumber() {
            let arr = document.form.arr.value.split(",");
            let num = parseInt(document.form.num.value);
            for (let i = 0; i < arr.length; i++) {
                arr[i] = parseInt(arr[i]);
            }
            for (let i = 0; i < arr.length - 1; i++) {
                for (let j = 0; j < arr.length - 1 - i; j++) {
                    if (arr[j] > arr[j + 1]) {
                        let temp = arr[j];
                        arr[j] = arr[j + 1];
                        arr[j + 1] = temp;
                    }
                }
            }
            console.log(arr);
            let found = false;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] == num) {
                    arr[i] = "*";
                    found = true;
                }
            }
            console.log(arr);
            if (found) {
                alert("Array after removing " + num + ": " + arr)
            } else {
                alert(num + " is not present in the array\n" + arr)
            }
        }

    </script>
</body>

</html>
